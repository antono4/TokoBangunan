<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Toko Bangunan</title>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Font AdminLTE (Source Sans 3) -->
<link href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" rel="stylesheet">
<!-- AdminLTE v4 (sudah mencakup Bootstrap 5) -->
<link href="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/css/adminlte.min.css" rel="stylesheet">

<style>
  /* ================= SINGLE-PAGE LOGIN ================= */
  body.login-page {
    background: linear-gradient(135deg, #1b2431 0%, #0d6efd 150%);
  }

  .login-wrap {
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    border: none;
    border-radius: 1.5rem;
    box-shadow: 0 24px 60px rgba(0,0,0,.16);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.7);
  }
  .login-card .card-body {
    padding: 2.5rem 2.25rem;
  }
  .login-card .login-header {
    text-align: center;
    margin-bottom: 1.75rem;
  }
  .login-card .login-header i {
    color: #e6a800;
    font-size: 2.6rem;
    margin-bottom: .75rem;
    display: block;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
  }
  .login-card .login-header h3 {
    font-weight: 800;
    letter-spacing: .5px;
    color: #1b2431;
    margin: 0 0 .5rem;
  }
  .login-card .login-header p {
    margin: 0;
    color: #6c757d;
    font-size: .95rem;
  }

  .kartu-demo {
    font-size: .82rem;
    background: #f8f9fa;
    border: 1px dashed #adb5bd;
    border-radius: .5rem;
    padding: 1rem;
    margin-top: 1.5rem;
  }

  /* Responsif */
  @media (max-width: 767.98px) {
    .login-wrap { padding: 1.5rem 1rem; }
    .login-card { max-width: 100%; border-radius: 1rem; }
  }
</style>
</head>
<body class="login-page bg-body-tertiary">

<div class="login-wrap">

  <!-- ============ FORM LOGIN (SATU HALAMAN) ============ -->
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">

      <div class="login-header">
        <i class="bi bi-box-arrow-in-right"></i>
        <h3 class="fw-bold mb-0" id="brand-nama">TOKO BANGUNAN</h3>
        <p>Silakan masuk ke akun Anda</p>
      </div>

      <div id="banner-diagnostik" class="alert alert-warning py-2 small d-none" role="alert">
        <b><i class="bi bi-buildings-fill me-1"></i>Perlu Perbaikan Backend</b>
        <ol class="ps-3 mb-1 mt-1" id="daftar-kendala"></ol>
        <div class="text-secondary">Setelah diperbaiki, muat ulang halaman ini.</div>
      </div>

      <form id="form-login" onsubmit="doLogin(event)">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" required autocomplete="username" autofocus
                   pattern="[a-zA-Z0-9._\-]{3,50}"
                   title="Username 3-50 karakter: huruf, angka, titik, garis bawah, dan minus.">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
              <i class="bi bi-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold" id="btn-login">
          <span id="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Login</span>
        </button>
      </form>

    </div>
  </div>

</div>

<!-- Modal Popup Flash -->
<div class="modal fade" id="modal-flash" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-transparent">
        <h5 class="modal-title fw-bold" id="flash-judul"><i class="bi bi-exclamation-triangle-fill me-2"></i>Perlu Perhatian</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body" id="flash-body"></div>
      <div class="modal-footer bg-transparent">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/js/adminlte.min.js"></script>
<script>
// Nama toko dinamis dari pengaturan (GET tanpa login, data tidak sensitif)
fetch('api/pengaturan.php')
  .then(r => r.json())
  .then(j => {
    if (j.ok) {
      const nama = j.pengaturan.nama_toko;
      document.getElementById('brand-nama').textContent = nama;
    }
  })
  .catch(() => {});

// Diagnostik database: bila ada kendala (db belum diimport, trigger kurang),
// tampilkan banner berisi langkah pembahasan yang persis di atas form login.
fetch('api/cek_database.php')
  .then(r => r.json())
  .then(j => {
    if (j.ok && j.kendala && j.kendala.length > 0) {
      const daftar = document.getElementById('daftar-kendala');
      daftar.innerHTML = j.kendala.map(k =>
        `<li><b>${k.pesan}</b><br><span class="text-secondary">${k.solusi}</span></li>`).join('');
      document.getElementById('banner-diagnostik').classList.remove('d-none');
    }
  })
  .catch(() => { /* cek_database tak terjangkau -> biarkan form login bertindak */ });

// Jika sudah login, langsung ke dashboard
fetch('api/me.php')
  .then(r => { if (r.ok) location.href = 'dashboard.html'; });

function togglePassword() {
  const el  = document.getElementById('password');
  const eye = document.getElementById('eye-icon');
  el.type = el.type === 'password' ? 'text' : 'password';
  eye.className = el.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

// ---------- POPUP FLASH (Bootstrap modal) ----------
let modalFlash = null;

function tampilFlash(pesan, tipe) {
  const body = document.getElementById('flash-body');
  const ikon = (tipe === 'success')
    ? 'bi bi-check-circle-fill text-success'
    : (tipe === 'warning')
      ? 'bi bi-exclamation-triangle-fill text-warning'
      : 'bi bi-exclamation-triangle-fill text-danger';
  body.innerHTML =
    '<div class="d-flex align-items-start gap-2">' +
      `<i class="bi ${ikon} fs-2"></i>` +
      `<div>${pesan}</div>` +
    '</div>';
  if (!modalFlash) {
    modalFlash = new bootstrap.Modal(document.getElementById('modal-flash'), {
      keyboard: false, backdrop: 'static'
    });
  }
  modalFlash.show();
}

async function doLogin(e) {
  e.preventDefault();
  const btn      = document.getElementById('btn-login');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  // Validasi sisi klien (sinkron dengan server) -> popup flash
  if (username === '' || password === '') { tampilFlash('Username dan password wajib diisi.', 'danger'); return; }
  if (username.length < 3 || username.length > 50) { tampilFlash('Username harus 3-50 karakter.', 'danger'); return; }
  if (!/^[a-zA-Z0-9._-]+$/.test(username)) { tampilFlash('Username hanya boleh huruf, angka, titik, garis bawah, dan minus.', 'danger'); return; }

  btn.disabled = true;
  document.getElementById('btn-text').innerHTML =
    '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';

  try {
    const res = await fetch('api/login.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const json = await res.json();

    if (json.ok) {
      location.href = 'dashboard.html';
      return;
    }
    tampilFlash(json.message || 'Login gagal.', 'danger');
  } catch (err) {
    tampilFlash(
      'Tidak dapat terhubung ke server (API). Checklist cepat:<ol class="ps-3 mb-0">' +
      '<li>Modul <b>Apache</b> &amp; <b>MySQL</b> di XAMPP sudah Start?</li>' +
      '<li>Folder aplikasi ada di <code>C:\\xampp\\htdocs\\TokoBangunan</code>?</li>' +
      '<li>Akses halaman via <code>http://localhost/...</code> (bukan file://)?</li>' +
      '</ol>', 'danger');
  } finally {
    btn.disabled = false;
    document.getElementById('btn-text').innerHTML =
      '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
  }
}
</script>
</body>
</html>
