<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Toko Bangunan</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1b2431 0%, #2c3a4f 55%, #0d6efd 140%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    border: none;
    border-radius: 1rem;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .login-card .brand {
    font-weight: 800;
    letter-spacing: .5px;
    color: #1b2431;
  }
  .login-card .brand i { color: #e6a800; }
  .kartu-demo {
    font-size: .82rem;
    background: #f8f9fa;
    border: 1px dashed #adb5bd;
    border-radius: .5rem;
  }
</style>
</head>
<body>

<div class="card login-card">
  <div class="card-body p-4 p-md-5">

    <div class="text-center mb-4">
      <i class="bi bi-hammer display-3"></i>
      <h3 class="brand mb-0 mt-2" id="brand-nama">TOKO BANGUNAN</h3>
      <p class="text-secondary small mb-0">Aplikasi Penjualan &amp; Kasir</p>
    </div>

    <div id="alert-login" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form id="form-login" onsubmit="doLogin(event)">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" required autocomplete="username" autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold" id="btn-login">
        <span id="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Login</span>
      </button>
    </form>

    <div class="kartu-demo mt-4 p-3">
      <b><i class="bi bi-info-circle me-1"></i>Akun demo</b><br>
      Admin: <code>admin</code> / <code>admin123</code><br>
      Kasir: <code>kasir1</code> / <code>kasir123</code>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Nama toko dinamis dari pengaturan (GET tanpa login, data tidak sensitif)
fetch('api/pengaturan.php')
  .then(r => r.json())
  .then(j => {
    if (j.ok) document.getElementById('brand-nama').textContent = j.pengaturan.nama_toko;
  })
  .catch(() => {});

// Jika sudah login, langsung ke dashboard
fetch('api/me.php')
  .then(r => { if (r.ok) location.href = 'dashboard.html'; });

function togglePassword() {
  const el  = document.getElementById('password');
  const eye = document.getElementById('eye-icon');
  el.type = el.type === 'password' ? 'text' : 'password';
  eye.className = el.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

async function doLogin(e) {
  e.preventDefault();
  const alertBox = document.getElementById('alert-login');
  const btn      = document.getElementById('btn-login');

  alertBox.classList.add('d-none');
  btn.disabled = true;
  document.getElementById('btn-text').innerHTML =
    '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';

  try {
    const res = await fetch('api/login.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const json = await res.json();

    if (json.ok) {
      location.href = 'dashboard.html';
      return;
    }
    alertBox.textContent = json.message || 'Login gagal.';
    alertBox.classList.remove('d-none');
  } catch (err) {
    alertBox.textContent = 'Tidak dapat terhubung ke server. Pastikan backend PHP & database berjalan.';
    alertBox.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    document.getElementById('btn-text').innerHTML =
      '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
  }
}
</script>
</body>
</html>
